# deny.toml — cargo-deny configuration for vulnerability and license scanning

[advisories]
version = 2

[licenses]
version = 2
# Permissive licenses plus the Stellar/Soroban ecosystem's ISC.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-4-Clause",
  "Unlicense",
  "ISC",
  # Pulled in transitively by the ICU crates and the TLS root-certificate data.
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
