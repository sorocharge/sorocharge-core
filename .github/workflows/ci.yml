name: ci

# Every `uses:` below is pinned to a commit SHA with the human-readable
# version as a trailing comment. A tag (`@v4`) or branch (`@master`) can be
# repointed at any time by whoever controls that repository; a SHA cannot.
# When upgrading an action, update both the SHA and the comment together.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 03:17 UTC — off the top of the hour to avoid the CI rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

  coverage:
    # Measuring coverage needs the test suite to run under llvm-cov
    # instrumentation, so this is its own job rather than part of build-test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Generate code coverage (HTML)
        run: cargo llvm-cov --workspace --html

      - name: Upload LCOV report to Codecov
        # Skipped when CODECOV_TOKEN isn't configured (e.g. PRs from forks);
        # the HTML artifact below is still produced so a reviewable report
        # always exists.
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/llvm-cov/html/index.html

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  golden-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install golden-vector generator deps
        working-directory: tests/golden_vectors
        run: npm ci

      - name: Lint golden-vector generator
        working-directory: tests/golden_vectors
        run: npm run lint

      - name: Check golden-vector formatting
        working-directory: tests/golden_vectors
        run: npm run format:check

      - name: Generate golden vectors
        working-directory: tests/golden_vectors
        run: node generate.mjs

      - name: Diff generated fixtures against committed fixtures
        run: git diff --exit-code -- tests/golden_vectors/fixtures

      - name: Run golden-vector tests
        run: cargo test --workspace -- golden_vector

  malware-scan:
    # Runs on every PR and push, same as build-test/deny/golden-vectors — not
    # gated behind schedule/workflow_dispatch like fuzz is, since this check
    # is fast and has no flaky external dependency of its own (the IOC scan
    # is pure local pattern-matching; ClamAV's signature update is allowed to
    # fail soft without blocking, see below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available for the protected-files diff check
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: IOC and heuristic scan (security/malware_iocs.json + generic checks)
        id: ioc_scan
        continue-on-error: true
        run: python3 scripts/malware_scan.py

      - name: Install ClamAV
        run: sudo apt-get update -qq && sudo apt-get install -y clamav clamav-freshclam

      - name: Update ClamAV signatures
        # Best-effort: ClamAV's mirror infrastructure is a known source of
        # CI flakiness unrelated to anything in this PR. A stale/missing DB
        # is handled explicitly below, not by silently skipping the scan.
        continue-on-error: true
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet

      - name: ClamAV scan (broader, signature-based detection)
        run: |
          set +e
          clamscan -r --infected \
            --exclude-dir='(^|/)\.git($|/)' \
            --exclude-dir='(^|/)target($|/)' \
            --exclude-dir='(^|/)node_modules($|/)' \
            --exclude-dir='(^|/)vendor($|/)' \
            .
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::ClamAV found infected file(s) — see output above."
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::ClamAV scan errored (e.g. signature DB unavailable) rather than finding malware — not blocking on this alone, but investigate."
          fi
          exit 0

      - name: Fail the job if the IOC/heuristic scan found something
        if: steps.ioc_scan.outcome == 'failure'
        run: |
          echo "::error::IOC/heuristic malware scan failed — see the scan step above for details."
          exit 1

  fuzz:
    # Fuzzing needs nightly Rust and a long time budget, so it runs on the
    # nightly schedule (or a manual dispatch) instead of blocking every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: sorocharge-signer
            target: verify_entry
          - crate: sorocharge-x402
            target: parse_payment_transaction
          - crate: sorocharge-mpp
            target: parse_payment_transaction
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz ${{ matrix.crate }}::${{ matrix.target }}
        # Run from inside `fuzz/` so its `rust-toolchain.toml` (nightly) is
        # honored even if the runner's default toolchain is stable.
        working-directory: crates/${{ matrix.crate }}/fuzz
        # Bounded per-target budget; a crash fails the job.
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096

  semver-checks:
    # Detect unintended semver-breaking API changes against the last released tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: v0.1.2
